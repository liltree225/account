services:
  account_db:
    image: postgres:16
    container_name: account-db
    environment:
      POSTGRES_DB: account-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - account_data:/var/lib/postgresql/data
      - ./src/main/resources/liquibase/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

